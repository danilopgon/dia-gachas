<div class="backdrop" id="gachas-bg-anim" aria-hidden="true">
  <img src="/assets/images/fondo-cielo.webp" id="fondo-cielo" alt="" />
  <img src="/assets/images/fondo-colinas.webp" id="fondo-colinas" alt="" />
  <img src="/assets/images/fondo-colinas-frente.webp" id="fondo-colinas-frente" alt="" />
  <img src="/assets/images/fondo-sol.webp" id="fondo-sol" alt="" />
</div>

<main class="stage stage--home" role="main">
  <div class="container stage__inner">
    <header class="headline">
      <h1 class="poster-title rise" style="--i: 1" i18n="@@home.title" id="main-title">
        ¿Hace día de gachas?
      </h1>
      <h2 class="poster-lead rise" style="--i: 2" i18n="@@home.subtitle">
        ¡Busca tu pueblo y descúbrelo!
      </h2>
    </header>

    <div class="well rise" style="--i: 3">
      <app-municipio-combobox
        label="Busca tu pueblo"
        i18n-label="@@home.search"
        [suggestions]="cities()"
        [status]="comboboxStatus()"
        (query)="search({ query: $event })"
        (selected)="value.set($event)"
      />

      <button
        type="button"
        class="btn-primary btn-primary--block"
        [disabled]="!value()?.id"
        (click)="goToResult()"
        aria-label="Consulta al oráculo de las gachas. Selecciona un pueblo antes de pulsar"
      >
        <app-icon name="search" />
        <span i18n="@@home.button">Consulta al oráculo<span class="wide-only"> de las gachas</span></span>
      </button>
    </div>
  </div>
</main>
